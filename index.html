
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>시소가 만든 파티 전용 족보</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="clock" style="text-align:center; font-weight:bold; font-size:1.2em; margin:10px 0;"></div>
  <h1 style="text-align:center;">시소가 만든 파티 전용 족보</h1>
  <div style="text-align:center;">
    <input type="text" id="search" placeholder="검색어 입력 후 Enter" />
  </div>
  <div id="results" class="container"></div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = '현재 시각: ' + now.toLocaleString();
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

  <script src="script.js"></script>
</body>
</html>
